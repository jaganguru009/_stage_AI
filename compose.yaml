services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stage
      POSTGRES_PASSWORD: stage_local_password
      POSTGRES_DB: stage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage -d stage"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  stage-postgres:
